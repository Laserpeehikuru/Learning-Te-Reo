<!DOCTYPE html>
<html lang="en-NZ">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pōtahi | Kōrero</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>


  <main class="site-shell">

    <!-- NAVIGATION -->

    <nav class="top-nav" aria-label="Main navigation">

      <a href="index.html">
        <img src="graphics/website_logo.png" alt="Pōtahi website logo">
      </a>

      <a href="index.html">
        Home
      </a>

      <a href="learning.html">
        Learning
      </a>

      <a href="Quiz.html">
        Quiz
      </a>

      <a class="nav-pill" href="korero.html">
        Kōrero
      </a>

    </nav>


    <!-- HERO -->

    <section class="hero">

      <div>

        <p class="learning-eyebrow">
          KŌRERO
        </p>

        <h1>
          Let's Kōrero
        </h1>

        <h2>
          He wā kōrero
        </h2>

      </div>

      <a class="button" href="#korero">
        Share Your Thoughts
      </a>

    </section>


    <!-- KŌRERO SECTION -->

    <section id="korero" class="quiz-section">


      <!-- INTRO CARD -->

      <div class="quiz-card quiz-intro-card">

        <div class="quiz-icon">
          💬
        </div>

        <p class="learning-eyebrow">
          KŌRERO
        </p>

        <h2>
          Ask A Question Or Give Feedback
        </h2>

        <h3>
          Have a question about Te Reo Māori?
          Found something you enjoyed?
          Or have an idea that could make Pōtahi better?
          Share your kōrero below.
        </h3>


        <!-- FORM -->

        <form action="mailto:eliezer_pee@student.asdah.school.nz" method="post" enctype="text/plain">


          <div class="form-group">

            <label for="name">
              Your Name
            </label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
              required>

          </div>


          <div class="form-group">

            <label for="email">
              Your Email
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required>

          </div>


          <div class="form-group">

            <label for="message">
              Your Kōrero
            </label>

            <textarea
              id="message"
              name="message"
              rows="7"
              placeholder="Ask a question, give feedback, or share a suggestion..."
              required></textarea>

          </div>


          <button type="submit" class="quiz-button">
            Send Kōrero →
          </button>


        </form>

      </div>


    </section>


    <!-- FOOTER -->

    <footer class="footer-nav">

      <span>
        Pōtahi
      </span>

      <a href="index.html">
        Home
      </a>

      <a href="learning.html">
        Learning
      </a>

      <a href="Quiz.html">
        Quiz
      </a>

      <a href="korero.html">
        Kōrero
      </a>

    </footer>


  </main>


</body>

</html>
